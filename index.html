<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Timer💖</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="app.css">
</head>

<body>

  <div class="container">
    <div class="heart mb-2">💖</div>
    <h1>Tiempo para ver a mi linda linda:</h1>
    <div id="countdown">
      <span id="days">0</span> días,
      <span id="hours">0</span> horas,
      <span id="minutes">0</span> minutos,
      <span id="seconds">0</span> segundos
    </div>
    <div id="quote" class="mt-4"></div>
  </div>

  <script src="app.js"></script>
</body>

</html>
